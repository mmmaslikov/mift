:root{
  --bg:#f2f2f2; --m2:#e6e6e6; --charcoal:#2f2d2c;
  --surface:#ffffff; --surface-2:#fafafa;
  --text:#1d1d1f; --muted:#6f6f6f;
  --line:rgba(0,0,0,.10);
  --accent:#0071e3; --hero-acc:#4da3ff;
  --radius:20px; --shadow:0 12px 34px rgba(0,0,0,.10);
  --nav-h:60px; --pad:clamp(16px,4vw,44px); --wrap:1200px; --col:960px; --zoom:1;
}
@media (min-width:1800px){:root{--zoom:1.25}}
@media (min-width:2300px){:root{--zoom:1.5}}
html{zoom:var(--zoom)}
[data-theme="dark"]{
  --bg:#161616; --m2:#1d1d1d; --charcoal:#232120;
  --surface:#222222; --surface-2:#2a2a2a; --text:#f2f2f2; --muted:#9c9c9c;
  --line:rgba(255,255,255,.12); --accent:#2997ff; --hero-acc:#2997ff;
  --shadow:0 14px 40px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);
  font:17px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
body.lb-open{overflow:hidden}
img{max-width:100%;display:block}
h1,h2,h3{letter-spacing:-.02em;line-height:1.15;margin:0}
p{margin:0}
a{color:var(--accent)}
strong{font-weight:700;color:var(--text)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--pad)}
.j{text-align:justify;hyphens:auto}

.panel,.mcard,.cons{--acc:var(--acc-l,#0071e3)}
[data-theme="dark"] .panel,[data-theme="dark"] .mcard,[data-theme="dark"] .cons{--acc:var(--acc-d,#2997ff)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 18px;
  border-radius:12px;border:1px solid color-mix(in srgb,var(--acc) 30%,transparent);
  background:color-mix(in srgb,var(--acc) 13%,transparent);color:var(--acc);
  font:inherit;font-weight:600;font-size:14.5px;cursor:pointer;text-decoration:none;transition:background .18s,transform .18s}
.btn svg{width:16px;height:16px;flex:none}

.btn.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
.btn.ghost:hover{color:var(--acc);border-color:var(--acc);background:transparent}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:980px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.22);font-size:13.5px;color:rgba(255,255,255,.88);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

.nav{position:sticky;top:0;z-index:50;height:var(--nav-h);background:var(--charcoal);
  border-bottom:1px solid rgba(255,255,255,.08)}

.hero{position:relative;overflow:hidden;background:var(--charcoal);color:#fff;padding:clamp(36px,6vw,72px) 0 clamp(32px,5vw,56px)}

.tabs-bar{position:sticky;top:var(--nav-h);z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:6px;
  max-width:var(--wrap);margin:0 auto;padding:10px var(--pad)}
.tab-btn{--tab:var(--acc-l);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:10px 8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);

  min-height:64px;cursor:pointer;transition:all .18s}

.tab-btn .ti{font-size:19px;line-height:1}

.mcard{padding:clamp(18px,2.4vw,26px);display:flex;flex-direction:column;gap:14px;border-top:4px solid var(--acc)}
.m-head{display:flex;align-items:center;gap:14px}
.m-head .mi{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none;

.m-head .mi svg{width:24px;height:24px}
.m-head h3{font-size:18px}
.mcard>p{color:var(--muted);font-size:15px}
.m-links{display:flex;flex-wrap:wrap;gap:8px}
.m-link{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;border:1px solid var(--line);

.m-link:hover{border-color:var(--acc);color:var(--acc)}
.m-link svg{width:14px;height:14px;flex:none}

/* СКРИНШОТЫ */
.shots{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:700px){.shots.shots-2{grid-template-columns:1fr 1fr}}
.shot{margin:0;display:grid;gap:8px}
.shot-frame{position:relative;display:block;width:100%;aspect-ratio:16/10;overflow:hidden;padding:0;
  border-radius:14px;border:1px solid var(--line);background:var(--surface-2);cursor:zoom-in}
.shot-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;
  opacity:0;transition:opacity .5s,transform .5s}
.shot-frame.is-loaded img{opacity:1}
.shot-frame:hover img{transform:scale(1.03)}
.shot-frame.is-missing img{display:none}
.shot-ph{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  color:var(--muted);background:var(--surface-2);text-align:center;padding:12px}
.shot-frame.is-missing .shot-ph{display:flex}
.shot-ph svg{width:26px;height:26px;opacity:.6}
.ph-file{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;opacity:.85;word-break:break-all}
.shot-zoom{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  background:rgba(0,0,0,.55);color:#fff;opacity:0;transition:opacity .2s;pointer-events:none}
.shot-zoom svg{width:16px;height:16px}
.shot-frame:hover .shot-zoom,.shot-frame:focus-visible .shot-zoom{opacity:1}
.shot figcaption{font-size:13px;color:var(--muted);text-align:center}

/* АЛГОРИТМЫ / СЛОВАРЬ */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:st}
.steps li{position:relative;padding-left:44px;counter-increment:st;color:var(--muted);font-size:14.5px;line-height:1.55}
.steps li::before{content:counter(st);position:absolute;left:0;top:1px;width:28px;height:28px;border-radius:9px;
  background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);font-weight:700;font-size:13px;display:grid;place-items:center}
.gloss{margin:0;display:grid;gap:10px}
.gloss div{padding:10px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.gloss dt{font-weight:700;font-size:14.5px}
.gloss dd{margin:2px 0 0;color:var(--muted);font-size:14px;line-height:1.5}

/* АККОРДЕОН ПРОМТА */
.p-acc{border-top:1px dashed var(--line);padding-top:10px;margin-top:auto}
.p-acc-btn{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;min-height:44px;

.p-acc-btn svg{width:18px;height:18px;transition:transform .25s;flex:none}
.p-acc.open .p-acc-btn svg{transform:rotate(180deg)}

.p-acc.open .p-acc-body{max-height:1800px}
.p-pre{margin:10px 0;padding:16px 18px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);
  font-family:inherit;font-size:15px;line-height:1.65;white-space:pre-wrap;color:var(--text)}
.p-actions{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:6px}

/* КОНСТРУКТОР */
.cons{padding:clamp(18px,2.4vw,26px);margin:0 auto 20px;max-width:var(--col);display:grid;gap:16px;border-top:4px solid var(--acc)}
.cons-title{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700}
.cons-title .ci2{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;

.cons-grid{display:grid;gap:12px;grid-template-columns:1fr}

.field{display:grid;gap:6px}
.field-wide{grid-column:1/-1}
.field>label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field-wide>label{text-transform:none;letter-spacing:0;font-size:13.5px;font-weight:600}
.field input,.field select{font:inherit;font-size:15px;color:var(--text);background:var(--surface-2);
  border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:46px;width:100%}
.field input:focus,.field select:focus{outline:3px solid var(--accent);outline-offset:2px}
.cons-checks{display:flex;flex-wrap:wrap;gap:6px}
.cons-checks .chk{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:7px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;
  min-height:26px;line-height:1.2;text-transform:none;letter-spacing:0}
.cons-checks .chk input{width:12px;height:12px;accent-color:var(--acc);margin:0;cursor:pointer;outline:none;flex:none}
.cons-checks .chk input:focus,.cons-checks .chk input:focus-visible{outline:none;box-shadow:none}
.cons-checks .chk:has(input:checked){border-color:color-mix(in srgb,var(--acc) 45%,var(--line));color:var(--acc)}
.cons-out{margin:0;padding:16px 18px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);
  font-family:inherit;font-size:15px;line-height:1.65;white-space:pre-wrap;color:var(--text)}
.cons-actions{display:flex;gap:10px;flex-wrap:wrap}

/* FOOTER */
.footer{background:var(--charcoal);color:#fff;padding:clamp(32px,5vw,56px) 0}
.footer-in{display:grid;gap:16px;justify-items:center;text-align:center}
.f-title{font-size:clamp(18px,2.2vw,24px);font-weight:700}
.f-link{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;
  border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.85);text-decoration:none;font-size:14px;font-weight:600;min-height:42px}
.f-link:hover{color:#fff;border-color:#fff}
.f-link svg{width:15px;height:15px;flex:none}
.f-copy{color:rgba(255,255,255,.55);font-size:14px}

/* ЛАЙТБОКС */
.lb{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:16px}
.lb[hidden]{display:none}
.lb-back{position:absolute;inset:0;background:rgba(10,10,12,.84)}

.lb-frame{display:block;width:fit-content;max-width:100%;border-radius:14px;overflow:hidden;
  background:#141416;border:1px solid rgba(255,255,255,.15)}

.lb-frame .shot-ph{position:relative;display:flex;background:transparent;color:#bbb;
  min-width:min(420px,80vw);min-height:220px}

.lb-nav{display:flex;align-items:center;justify-content:center;gap:10px}
.lb-nav .icon-btn{width:42px;height:42px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);
  color:#fff;display:grid;place-items:center;cursor:pointer}
.lb-nav .icon-btn svg{width:18px;height:18px}

  padding:12px 22px;border-radius:12px;background:var(--charcoal);color:#fff;border:1px solid rgba(255,255,255,.18);

</style>

const rich=s=>esc(s).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
const plural=(n,a,b,c)=>{const m=n%100;if(m>=11&&m<=14)return c;switch(n%10){case 1:return a;case 2:case 3:case 4:return b;default:return c;}};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2400);}
async function copyText(txt){
  try{await navigator.clipboard.writeText(txt);toast("Промт скопирован");}
  catch(e){const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.left="-9999px";
    document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");toast("Промт скопирован");}catch(err){toast("Скопируйте текст вручную");}
    document.body.removeChild(ta);}
}
function bindShots(root){
  $$("img[data-file]",root).forEach(img=>{
    const frame=img.closest(".shot-frame");
    img.addEventListener("error",()=>frame&&frame.classList.add("is-missing"));
    img.addEventListener("load",()=>frame&&frame.classList.add("is-loaded"));
    if(img.complete&&img.naturalWidth>0)frame&&frame.classList.add("is-loaded");
  });
}

function shotsBlock(shots){
  if(!shots||!shots.length)return "";
  const list=shots.map(s=>s.file).join("|");
  return `<div class="shots ${shots.length>1?"shots-2":""}">${shots.map((s,i)=>`
    <figure class="shot">
      <button class="shot-frame" type="button" data-list="${esc(list)}" data-idx="${i}" aria-label="Открыть скриншот крупно: ${esc(s.cap||s.file)}">
        <img data-file="${esc(s.file)}" src="${IMG}${esc(s.file)}" alt="${esc(s.cap||s.file)}" loading="lazy">

}

    <div class="lb-back" data-lb-close></div>
    <figure class="lb-card">
      <div class="lb-frame" id="lb-frame"></div>
      <figcaption class="lb-cap" id="lb-cap"></figcaption>
      <div class="lb-nav">
        <button class="icon-btn" id="lb-prev" type="button" aria-label="Предыдущий">${ICONS.left}</button>
        <span class="lb-count" id="lb-count"></span>
        <button class="icon-btn" id="lb-next" type="button" aria-label="Следующий">${ICONS.right}</button>
        <button class="icon-btn" id="lb-close" type="button" aria-label="Закрыть">${ICONS.close}</button>
      </div>
    </figure>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>`;
  updateCons();
  bindShots(document);
}

function consFields(){
  return {subject:$("#c-subject")?.value||CONS.subjects[0],topic:$("#c-topic")?.value.trim()||"",
    grade:$("#c-grade")?.value.trim()||"",level:$("#c-level")?.value||CONS.levels[0],
    format:$("#c-format")?.value||CONS.formats[0],output:$("#c-output")?.value||CONS.outputs[0],
    includes:$$("#cons-checks input:checked").map(i=>i.value)};
}
function buildCons(f){
  const inc=f.includes.length?f.includes.map((x,i)=>`${i+1}. ${x};`).join("\n"):"1. ответы и ключи;";
  return `Ты — опытный методист по предмету «${f.subject}» и эксперт по разработке учебных материалов.\nРазработай «${f.format}» по теме «${f.topic||"[ТЕМА]"}» для ${f.grade||"[КЛАСС]"} класса, уровень: ${f.level}.\n\nИтоговый формат материала: ${f.output}.\n\nОбязательное содержание:\n${inc}\n\nТребования:\n- формулировки понятны ученику этого возраста, без двусмысленностей;\n- ответы и критерии согласованы с формулировками и проверяемы вторым учителем;\n${OUTPUT_REQ[f.output]||""}- в конце добавь короткую методическую заметку: как использовать материал на уроке и как адаптировать под другой уровень.`;
}
function updateCons(){const o=$("#cons-out");if(o)o.textContent=buildCons(consFields());}

function switchTab(id){
  state.tab=id;
  $$(".tab-btn").forEach(b=>{const on=b.dataset.tab===id;b.classList.toggle("on",on);b.setAttribute("aria-selected",String(on));});
  $$(".panel").forEach(p=>p.classList.toggle("on",p.id==="panel-"+id));
  const panel=$("#panel-"+id),nav=$(".nav"),bar=$(".tabs-bar");
  if(panel&&nav&&bar){
    panel.style.scrollMarginTop=(nav.offsetHeight+bar.offsetHeight+10)+"px";
    const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
    panel.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});
  }
}

function openLb(list,idx){state.lb={list,idx};$("#lb").hidden=false;document.body.classList.add("lb-open");drawLb();}
function closeLb(){state.lb=null;$("#lb").hidden=true;document.body.classList.remove("lb-open");}
function stepLb(d){if(!state.lb)return;const n=state.lb.list.length;state.lb.idx=(state.lb.idx+d+n)%n;drawLb();}
function drawLb(){
  const {list,idx}=state.lb;const file=list[idx];
  const cap=(Object.values(CONTENT).flatMap(c=>c.cards).flatMap(c=>c.shots||[]).find(s=>s.file===file)||{}).cap||file;
  const frame=$("#lb-frame");
  frame.innerHTML=`<img src="${IMG}${esc(file)}" alt="${esc(cap)}"><span class="shot-ph" style="display:none">${ICONS.cam}<span class="ph-file">${IMG}${esc(file)}</span></span>`;
  const img=frame.querySelector("img"),ph=frame.querySelector(".shot-ph");
  img.addEventListener("error",()=>{img.style.display="none";ph.style.display="flex";});
  img.addEventListener("load",()=>{img.style.display="block";ph.style.display="none";});
  $("#lb-cap").textContent=cap;
  $("#lb-count").textContent=`${idx+1} / ${list.length}`;
  $("#lb-prev").style.visibility=list.length>1?"visible":"hidden";
  $("#lb-next").style.visibility=list.length>1?"visible":"hidden";
}

function resolvedTheme(){return state.theme==="auto"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):state.theme;}
function applyTheme(){document.documentElement.dataset.theme=resolvedTheme();
  const b=$("#theme-btn");if(b){b.innerHTML=resolvedTheme()==="dark"?ICONS.sun:ICONS.moon;
    b.setAttribute("aria-label",resolvedTheme()==="dark"?"Светлая тема":"Тёмная тема");}}
function toggleTheme(){state.theme=resolvedTheme()==="dark"?"light":"dark";
  try{localStorage.setItem("mift_theme_v1",state.theme);}catch(e){}applyTheme();}

function bindHandlers(){
  $("#theme-btn").addEventListener("click",toggleTheme);
  document.addEventListener("click",e=>{
    const tab=e.target.closest("[data-tab]");
    if(tab){switchTab(tab.dataset.tab);return;}
    const shot=e.target.closest(".shot-frame");
    if(shot){openLb(shot.dataset.list.split("|"),+shot.dataset.idx);return;}
    if(e.target.closest("[data-lb-close]")||e.target.closest("#lb-close")){closeLb();return;}
    if(e.target.closest("#lb-prev")){stepLb(-1);return;}
    if(e.target.closest("#lb-next")){stepLb(1);return;}
    const acc=e.target.closest(".p-acc-btn");
    if(acc){const box=acc.closest(".p-acc");const open=box.classList.toggle("open");acc.setAttribute("aria-expanded",String(open));return;}
    const cp=e.target.closest("[data-copybtn]");
    if(cp){const pre=cp.closest(".p-acc")?.querySelector(".p-pre");if(pre)copyText(pre.textContent);return;}
    if(e.target.closest("#cons-copy")){copyText($("#cons-out").textContent);}
  });
  document.addEventListener("input",e=>{if(e.target.closest(".cons"))updateCons();});
  document.addEventListener("change",e=>{if(e.target.closest(".cons"))updateCons();});
  document.addEventListener("keydown",e=>{
    if(state.lb){if(e.key==="Escape")closeLb();if(e.key==="ArrowLeft")stepLb(-1);if(e.key==="ArrowRight")stepLb(1);}
  });
}
function init(){
  try{const t=localStorage.getItem("mift_theme_v1");if(t==="light"||t==="dark")state.theme=t;}catch(e){}
  renderApp();bindHandlers();applyTheme();
}
init();
</script>
</body>
</html>
